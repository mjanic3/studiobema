	<script>

const fadeEffect = setInterval(() => {

  if (!preloader_lite.style.opacity) {

  if (preloader_lite.style.opacity > 0) {
    preloader_lite.style.opacity -= 0.2;
  } else {

  }
}, 50);

<script>
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('mobileToolsBtn');
  const panel = document.getElementById('mobilePanel');
  if (!btn || !panel) return;

  // Menu open/close button
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    panel.classList.toggle('is-open');
  });

  // Close when tapping outside
  document.addEventListener('click', () => panel.classList.remove('is-open'));
  panel.addEventListener('click', (e) => e.stopPropagation());
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const panel = document.querySelector('.mobilePanel');
  const backdrop = document.getElementById('mobileBackdrop');
  if (!panel || !backdrop) return;

  // Keep backdrop in sync whenever the panel is toggled
  function syncBackdrop() {
    backdrop.classList.toggle('is-open', panel.classList.contains('is-open'));
  }

  // 1) If your code toggles the panel class somewhere else,
  // this observer will automatically sync the backdrop.
  const observer = new MutationObserver(syncBackdrop);
  observer.observe(panel, { attributes: true, attributeFilter: ['class'] });

  // 2) Click backdrop to close
  backdrop.addEventListener('click', function () {
    panel.classList.remove('is-open');
    backdrop.classList.remove('is-open');
  });

  // 3) Close on Escape
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      panel.classList.remove('is-open');
      backdrop.classList.remove('is-open');
    }
  });

  // Initialize once on load
  syncBackdrop();
});
</script>
